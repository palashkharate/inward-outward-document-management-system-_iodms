# IODMS Docker Compose Configuration (Unified Architecture)
# ==========================================================
# This file defines 2 services (containers) that work together:
#   1. db           - PostgreSQL database
#   2. iodms-server - The Unified Python Server (Hosts both Backend API and React Frontend)
#
# To start everything: docker-compose up -d --build
# To stop everything:  docker-compose down
# To view logs:        docker-compose logs -f

services:

  # --- Container 1: PostgreSQL Database ---
  db:
    image: postgres:15
    container_name: iodms-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: iodms_db
    volumes:
      - iodms_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Container 2: Unified IODMS Server ---
  # This builds from the Dockerfile in the root directory.
  # It automatically compiles the React frontend and serves it using Python.
  iodms-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: iodms-unified-server:latest
    container_name: iodms-unified-server
    environment:
      DATABASE_URL: "postgresql+psycopg://postgres:postgres@db:5432/iodms_db"
      IODMS_ROOT_PATH: "/data/IODMS_DATA"
      IODMS_SETTINGS_FILE: "/app/settings_data/settings.json"
    volumes:
      - iodms_uploads:/data/IODMS_DATA
      - iodms_settings:/app/settings_data
    ports:
      # Map port 80 on the host to port 80 in the container
      - "80:80"
    depends_on:
      db:
        condition: service_healthy
    restart: always

volumes:
  iodms_db_data:
  iodms_uploads:
  iodms_settings:
